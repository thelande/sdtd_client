name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-release:
    name: Build Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true

      - name: Install dependencies
        run: go mod download

      - name: Build binary
        run: go build -ldflags "-s -w -X main.Version=${{ github.event.release.tag_name }}" -o sdtd_client main.go

      - name: Create release asset
        uses: softprops/action-gh-release@v1
        with:
          files: sdtd_client
          name: ${{ github.event.release.name }}
          tag_name: ${{ github.event.release.tag_name }}
          body: ${{ github.event.release.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
